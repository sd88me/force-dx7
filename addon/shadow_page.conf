# force-dx7 shadow-mode page -- see force-shadow's own DESIGN.md
# ("Live load test #22") and docs/adding-a-page.md for how this file
# format works and why it exists (a data-driven alternative to a
# compile-time build_<addon>_tab() function, so a new addon's page
# doesn't need a ForceShadow rebuild).
#
# Deliberately minimal: 4 of DX7's own real module.json params
# (output_level, algorithm, feedback, octave_transpose). DX7 sends plain
# integers for every param (confirmed by reading dx7_host.cpp's own
# handle_ctrl_line(), which uses atoi() throughout, unlike Maze Voice's
# own mix of "on"/"off" and "1"/"0" conventions) -- knobs alone keep this
# a clean first proof of the loader, without also needing to solve a
# per-widget value-convention question in the same pass.
page=1
ctrl_sock=/tmp/dx7_ctrl.sock
display_name=DX7
engine_process_name=dx7_host
engine_nsmodule_path=/media/662522/AddOns/ForceDX7/NSMODULE.json
engine_dirname=ForceDX7
engine_arguments_json=[{"NAME":"module-dir flag","VALUE":"--module-dir"},{"NAME":"module directory (module.json/banks source)","VALUE":"/media/662522/AddOns/ForceDX7"},{"NAME":"ctrl-sock flag","VALUE":"--ctrl-sock"},{"NAME":"control socket path","VALUE":"/tmp/dx7_ctrl.sock"},{"NAME":"control-channel flag","VALUE":"--control-channel"},{"NAME":"Q-Link control channel (1-16)","VALUE":"1"},{"NAME":"mix-slot flag","VALUE":"--mix-slot"},{"NAME":"ForceAudioIn voice slot (0-3; 2, since 0=Maze Voice, 1=JV-880)","VALUE":"2"}]

[tab DX7]
frame x=36 y=88 w=1208 h=624 title="VOICE"
knob cx=200 cy=320 r=50 label="OUTPUT" key=output_level min=0 max=100 pct=50
knob cx=480 cy=320 r=50 label="ALGORITHM" key=algorithm min=1 max=32 pct=0
knob cx=760 cy=320 r=50 label="FEEDBACK" key=feedback min=0 max=7 pct=0
knob cx=1040 cy=320 r=50 label="OCTAVE" key=octave_transpose min=-3 max=3 pct=50
